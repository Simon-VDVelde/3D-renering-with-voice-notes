<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 3D Digital Twin Iso Box Icon -->
  <g transform="translate(6, 6)">
    <!-- Top Face -->
    <polygon points="18,3 32,10 18,17 4,10" fill="url(#grad2)" />
    <!-- Left Face -->
    <polygon points="4,10 18,17 18,31 4,24" fill="url(#grad1)" opacity="0.85" />
    <!-- Right Face -->
    <polygon points="18,17 32,10 32,24 18,31" fill="url(#grad1)" />
    <!-- Spark / Point -->
    <circle cx="18" cy="17" r="2.5" fill="#ffffff" />
    <circle cx="32" cy="10" r="1.5" fill="#93c5fd" />
    <circle cx="4" cy="10" r="1.5" fill="#93c5fd" />
  </g>

  <!-- Text Branding -->
  <text x="48" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="0.5">
    SPATIAL <tspan fill="#60a5fa">SOP</tspan>
  </text>
  <text x="48" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" fill="#94a3b8" letter-spacing="1">
    ENTERPRISE DIGITAL TWIN
  </text>
</svg>
